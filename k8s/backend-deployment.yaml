# Backend Deployment
apiVersion: apps/v1
kind: Deployment

metadata:
  name: resume-ai-backend
  labels:
    app: resume-ai-backend

spec:
  # Run 2 backend Pods
  replicas: 2

  selector:
    matchLabels:
      app: resume-ai-backend

  template:
    metadata:
      labels:
        app: resume-ai-backend

    spec:
      containers:
      - name: backend

        # Backend Docker image
        image: venugopalareddy/resume-ai-update-backend:1.0
        imagePullPolicy: IfNotPresent

        # FastAPI port
        ports:
        - containerPort: 8000
        # Environment variables
        env:
        # Get API key from Kubernetes Secret
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: resume-ai-secret
              key: OPENAI_API_KEY

        # Allow frontend to access backend
        - name: CORS_ORIGINS
          value: "http://localhost:5173"
        # CPU and memory settings
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        # Check if application is ready
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10

        # Check if application is alive
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
